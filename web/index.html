<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hangar</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2f6f5e">
<style>
:root {
  --bg: #f3f4f1; --surface: #fff; --fg: #1c1f1d; --muted: #6a706b; --line: #dfe2dc;
  --accent: #2f6f5e; --accent-soft: #e2efe9; --live: #2b7bd6; --danger: #b3412f;
  /* status: a stopped session ("to resume") needs attention; one in progress is just marked, neutrally */
  --attention: #b7791f; --attention-soft: #fbf1df; --progress: #5b6b7a; --progress-soft: #e8ecf0;
  --sans: -apple-system, "SF Pro Text", system-ui, sans-serif; --mono: "SF Mono", ui-monospace, Menlo, monospace;
  /* chart series (validated: light vs #fff, dark vs #1c201e) and an age ramp, recent → stale */
  --s1: #14866a; --s2: #2b6fd6; --age1: #b9e3d3; --age2: #6cc4a6; --age3: #14866a; --age4: #0b4f3e;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #141715; --surface: #1c201e; --fg: #e6e9e5; --muted: #949b95; --line: #2c312e;
  --accent: #6cc4a6; --accent-soft: #1f3530; --live: #6aa8f0; --danger: #e07a68;
  --attention: #e8b25a; --attention-soft: #3a2f1c; --progress: #9aa8b5; --progress-soft: #262c31;
  --s1: #25a07f; --s2: #4f8fe6; --age1: #1f4a3d; --age2: #2f7a62; --age3: #4fb592; --age4: #9fe3c9; color-scheme: dark } }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; margin-bottom: 14px; }
h1 { font-size: 20px; margin: 0; flex: 1; }
#locale { font: 12px var(--sans); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.counts { font: 12px var(--mono); color: var(--muted); }
nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
nav button { font: 500 13px var(--sans); border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
nav button[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar input, .toolbar select { font: 13px var(--sans); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.toolbar input { flex: 1 1 220px; min-width: 0; }
.toolbar select { max-width: 220px; text-overflow: ellipsis; }
.split { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 12px; align-items: start; }
.split.none { grid-template-columns: minmax(0, 1fr); }
.split.none .detail { display: none; }
ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
#list li { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; padding: 7px 10px; align-items: center; cursor: pointer; }
#list li:hover { border-color: var(--muted); }
#list li.sel { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
#list li:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#list li.todo { border-left: 3px solid var(--attention); }
#list li.doing { border-left: 3px solid var(--progress); }
#list li.done { opacity: .6; }
#list li.done.sel { opacity: .85; }
#list li.over-before { box-shadow: 0 -4px 0 -1px var(--accent); }
#list li.over-after { box-shadow: 0 4px 0 -1px var(--accent); }
.rank { font: 500 12px var(--mono); color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; align-self: stretch; position: relative; user-select: none; }
/* The arrows and the grip sit over the row, so a line is no taller for having them. */
.rank button { position: absolute; left: 50%; transform: translateX(-50%); }
.rank button:first-child { top: -6px; }
.rank button:last-of-type { bottom: -6px; }
.rank .grip { position: absolute; left: -9px; top: 50%; transform: translateY(-50%); }
.rank.handle { cursor: grab; touch-action: none; }
#list li.dragging { opacity: .5; }
body.dragging { user-select: none; -webkit-user-select: none; }
body.dragging * { cursor: grabbing !important; }
.rank button { font: 10px var(--sans); line-height: 1; border: 0; background: none; color: var(--muted); padding: 1px 4px; cursor: pointer; border-radius: 4px; opacity: 0; }
#list li:hover .rank button, #list li.sel .rank button, .rank button:focus-visible { opacity: 1; }
.rank button:hover:not(:disabled) { color: var(--accent); background: var(--accent-soft); }
#list li .rank button:disabled { opacity: .2; cursor: default; }
.rank .grip { font-size: 12px; line-height: 1; padding: 1px 4px; border-radius: 4px; opacity: 0; }
#list li:hover .rank .grip { opacity: .8; }
.rank .grip:hover { color: var(--accent); background: var(--accent-soft); }
.rank .num { cursor: text; padding: 1px 2px; border-radius: 4px; }
.rank .num:hover { color: var(--fg); background: var(--line); }
.rank input { width: 28px; font: 500 12px var(--mono); text-align: center; padding: 1px 0; color: var(--fg); background: var(--bg); border: 1px solid var(--accent); border-radius: 4px; -moz-appearance: textfield; }
.rank input::-webkit-inner-spin-button { display: none; }
.main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.line { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.line .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fam { font: 12px var(--mono); color: var(--muted); flex: none; }
.sub { display: flex; gap: 8px; min-width: 0; overflow: hidden; white-space: nowrap; font: 12px var(--mono); color: var(--muted); }
.sub > * { flex: none; }
.sub > .chip { flex: 0 1 auto; min-width: 2.5em; overflow: hidden; text-overflow: ellipsis; }
.st-icon { flex: none; display: inline-flex; align-self: center; }
.st-icon.todo { color: var(--attention); }
.st-icon.doing { color: var(--progress); }
.st-icon.done { color: var(--muted); }
.extra { border-top: 1px solid var(--line); padding-top: 12px; }
.extra p { margin: 0; font-size: 13px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font: 12px var(--mono); color: var(--muted); }
.chip { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 6px; }
.hint { color: var(--accent); }
.live { color: var(--live); }
.warn { color: var(--danger); }
.muted { color: var(--muted); font-size: 13px; }
.mono { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.detail { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; box-sizing: border-box; }
.d-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.d-title { flex: 1 1 220px; min-width: 0; }
.d-title h2 { margin: 0; font-size: 18px; overflow-wrap: anywhere; }
.d-title .live, .d-title .muted { font: 12px var(--mono); }
.detail .btns { justify-content: flex-start; }
.detail .btn { font-size: 13px; padding: 6px 12px; }
.block { display: flex; flex-direction: column; gap: 4px; }
.k { font-size: 12px; color: var(--muted); }
.detail .prompt { font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; max-height: 9em; overflow-y: auto; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px 16px; font-size: 13px; }
.timeline { display: flex; flex-direction: column; border-left: 2px solid var(--line); margin-left: 4px; }
.timeline .step { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; padding: 4px 0 4px 12px; }
.timeline .step.cur .t { font-weight: 600; }
.timeline .t { font-size: 13px; }
.timeline .m { font: 12px var(--mono); color: var(--muted); flex: 1; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
details p { margin: 6px 0 0; font-size: 13px; overflow-wrap: anywhere; }
.btn.back-list { display: none; align-self: flex-start; }
.btn.hide-detail { padding: 4px 8px; color: var(--muted); }
.detail .k small { font-size: 12px; }
.detail .hbar.pick { cursor: pointer; border-radius: 4px; }
.detail .hbar.pick:hover { background: var(--accent-soft); }
.cols.short { height: 72px; }
/* The overview's sections stand apart: more air, and a rule between them. */
.detail.overview { gap: 0; }
.detail.overview > .block, .detail.overview > .warn-box { margin-top: 22px; }
.detail.overview > .block + .block { border-top: 1px solid var(--line); padding-top: 22px; }
.detail.overview > .block > .k:first-child { margin-bottom: 6px; }
.warn-box { background: var(--attention-soft); color: var(--attention); border-radius: 6px; padding: 8px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
textarea { width: 100%; box-sizing: border-box; font: 13px var(--sans); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; min-height: 32px; }
.status { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.status button { font: 500 12px var(--sans); border: 0; background: transparent; color: var(--muted); padding: 5px 9px; cursor: pointer; }
.status button[aria-pressed=true][data-s=todo] { background: var(--attention-soft); color: var(--attention); }
.status button[aria-pressed=true][data-s=doing] { background: var(--progress-soft); color: var(--progress); }
.status button[aria-pressed=true][data-s=done] { background: var(--line); color: var(--fg); }
/* Narrow: one column; the panel covers the list once a session is opened. */
@media (max-width: 760px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .split:not(.detail-open) .detail { display: none; }
  .split.detail-open #list { display: none; }
  .split.detail-open .btn.back-list { display: inline-block; }
  .btn.hide-detail { display: none; }
  .detail { position: static; max-height: none; }
}
.btns { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.btn { font: 12px var(--sans); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { color: var(--danger); }
.btn[aria-busy=true] { cursor: progress; opacity: .75; }
.btn[aria-busy=true]::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: -1px;
  border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .btn[aria-busy=true]::before { animation: none; } }
.btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 24px; text-align: center; color: var(--muted); }
.suggest { background: var(--accent-soft); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.suggest .quote { font-style: italic; color: var(--muted); overflow-wrap: anywhere; }
.suggest .btns { justify-content: flex-start; }
#insights { display: flex; flex-direction: column; gap: 14px; }
#tiles { margin-bottom: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tile .v { font: 600 22px var(--sans); font-variant-numeric: tabular-nums; }
.tile .k { font-size: 12px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.panel h2 { font-size: 14px; margin: 0; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.panel h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 14px; }
.hbar { display: grid; grid-template-columns: minmax(0, 220px) 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
.hbar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .val { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; min-width: 64px; }
.track { display: flex; gap: 2px; height: 12px; }
.track span { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.track span + span { border-radius: 0 4px 4px 0; }
.cols { display: flex; align-items: flex-end; gap: 2px; height: 120px; border-bottom: 1px solid var(--line); }
.cols .c { flex: 1; display: flex; gap: 2px; align-items: flex-end; height: 100%; }
.cols .c span { flex: 1; border-radius: 4px 4px 0 0; min-height: 1px; }
.axis { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--muted); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
td.n { font: 12px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
#settings { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
#settings > div:first-child { align-self: flex-start; }
#settingsBtn[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.accts input[type=number] { width: 64px; font: 12px var(--sans); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.accts .keep { font-size: 12px; color: var(--muted); }
.transfer { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; margin: 6px 0; }
.transfer select { font: 12px var(--sans); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.accts { display: flex; flex-direction: column; gap: 8px; }
.accts .a { display: grid; grid-template-columns: 28px minmax(0, 160px) 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
.accts .a.off { opacity: .55; }
.accts input[type=color] { width: 28px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
.accts input[type=text] { font: 13px var(--sans); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; min-width: 0; }
.accts .dir { font: 11px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.accts form { display: flex; gap: 6px; }
.accts form input { flex: 1; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; background: var(--fg); color: var(--bg); font-size: 13px; padding: 8px 14px; border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hangar</h1>
    <span class="counts" id="counts" data-i18n="loading"></span>
    <select id="machine" data-i18n-label="machine" hidden></select>
    <select id="locale" data-i18n-label="language"><option value="en">English</option><option value="pt">Português</option></select>
    <button class="btn" id="settingsBtn" data-i18n-label="settings">⚙</button>
  </header>
  <div class="warn-box" id="remoteBanner" hidden></div>
  <div class="tiles" id="tiles"></div>
  <nav id="tabs">
    <button data-v="pending" data-i18n="tabPending"></button>
    <button data-v="done" data-i18n="tabDone"></button>
    <button data-v="insights" data-i18n="tabInsights"></button>
  </nav>
  <div id="insights" hidden></div>
  <div id="settings" hidden></div>
  <div class="toolbar" id="toolbar">
    <input type="search" id="q" data-i18n-placeholder="filterPlaceholder" data-i18n-label="filter">
    <select id="acct" data-i18n-label="account" hidden></select>
    <select id="proj" data-i18n-label="project"></select>
    <select id="sort" data-i18n-label="sort">
      <option value=""></option>
      <option value="prompt" data-i18n="sortPrompt"></option>
    </select>
    <button class="btn" id="sortDir" data-i18n-label="sortDir"></button>
    <label class="btn"><input type="checkbox" id="liveOnly"> <span data-i18n="openOnly"></span></label>
    <label class="btn"><input type="checkbox" id="suggestedOnly"> <span data-i18n="suggestedOnly"></span></label>
    <button class="btn" id="checkNow" data-i18n="checkNow"></button>
  </div>
  <div class="split" id="split">
    <ol id="list"></ol>
    <section class="detail" id="detail" aria-live="polite"></section>
  </div>
  <div class="empty" id="empty" hidden></div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="/i18n.js"></script>
<script>
for (const e of document.querySelectorAll("[data-i18n]")) e.textContent = t(e.dataset.i18n);
for (const e of document.querySelectorAll("[data-i18n-placeholder]")) e.placeholder = t(e.dataset.i18nPlaceholder);
for (const e of document.querySelectorAll("[data-i18n-label]")) e.setAttribute("aria-label", t(e.dataset.i18nLabel));
document.querySelector("#locale").value = LOCALE;
document.querySelector("#locale").onchange = (e) => setLocale(e.target.value);
const $ = (s) => document.querySelector(s);
let items = [], accounts = [], classifier = null, view = "pending", dragId = null;
// Accounts are only shown once there is more than one to tell apart.
const shown = () => accounts.filter((a) => !a.hidden);
const multi = () => shown().length > 1;
const accountOf = (dir) => accounts.find((a) => a.dir === dir);
try { const v = location.hash.slice(1) || localStorage.getItem("view"); if (["done", "insights", "settings"].includes(v)) view = v; } catch {}
let sortRev = false;
try {
  const v = localStorage.getItem("sort"); if ([...$("#sort").options].some((o) => o.value === v)) $("#sort").value = v;
  sortRev = localStorage.getItem("sortRev") === "1";
} catch {}
// Each sort has a natural direction (your order 1 → n, dates newest first); the toggle flips it.
const sortAsc = () => ($("#sort").value === "" && view === "pending") !== sortRev;
// Any other order is a view of the list: the order you set stays, and can't be dragged in it.
const reorderable = () => view === "pending" && $("#sort").value === "" && !sortRev;
const settingsBack = () => showView(lastTab);
// Also called by the desktop app's Settings… menu item. Settings stands apart from the tabs: it isn't remembered,
// and its back button returns to the tab it was opened from.
let lastTab = view === "settings" ? "pending" : view;
function showView(v) {
  if (v !== "settings") { lastTab = v; try { localStorage.setItem("view", v); } catch {} }
  view = v;
  render();
}

// The machine whose sessions are shown: "" is this one, otherwise another machine of the odahcam account, reached
// through the relay. Only what that machine lets a paired device do goes there (see core/src/remote.rs); everything
// else, settings included, stays on this machine.
let cloud = null, remote = null, machine = "", machineNames = {};
try { machine = localStorage.getItem("machine") || ""; } catch {}
const REMOTE_OK = /^(GET \/api\/(sessions|accounts|machine)$|PATCH \/api\/session\/|POST \/api\/(order$|resume\/|close\/|dismiss-suggestion\/))/;
async function api(method, path, body) {
  if (machine && REMOTE_OK.test(`${method} ${path}`)) return apiLocal("POST", "/api/cloud/call", { device: machine, method, path, body: body ?? null });
  return apiLocal(method, path, body);
}

// The desktop app calls the core in-process (Tauri invoke); in a browser (tests, `npm start`) the same API is HTTP.
// Looked up per call so the desktop e2e target can stand in for a slow or failing core.
async function apiLocal(method, path, body) {
  const core = window.__TAURI__?.core;
  if (core) return core.invoke("api", { method, path, body: body ?? null }).catch((e) => { throw new Error(e); });
  const r = await fetch(path, { method, headers: { "x-hangar": "1", "content-type": "application/json" }, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
// Server error codes with a sentence of their own (err_<code> in i18n.js); others show as they are.
function failed(e) { const k = "err_" + e.message, s = t(k); return t("failed", { msg: s === k ? e.message : s }); }
async function act(fn, ok) { try { await fn(); if (ok) toast(ok); } catch (e) { toast(failed(e)); } await load(); }

// Edits apply to the local list and render at once; the request runs behind. A refused request reloads the
// server's state (rolling the edit back). Once no request is in flight, a quiet reload picks up derived fields.
let inFlight = 0, syncTimer;
async function mutate(apply, request, { ok, rerender = true } = {}) {
  apply();
  if (rerender) render();
  refreshTiles();
  inFlight++;
  try {
    await request();
    if (ok) toast(ok);
  } catch (e) {
    toast(failed(e));
    inFlight--;
    return load();
  }
  inFlight--;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { if (!inFlight && !dragId) load(); }, 800);
}

  const end = () => {
    clear(); li.classList.remove("dragging"); document.body.classList.remove("dragging"); start = target = null; dragId = null;
    window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp); window.removeEventListener("pointercancel", end);
  };

// The rank column: the session's place in the order you set (a dash before it has one), ↑/↓ around it, and the
// number itself takes a new place when clicked. The column is also the drag handle, so text in the row stays selectable.
function rankCell(s, rank, reorder, li) {
  const ids = triaged(), i = ids.indexOf(s.id);
  const num = el("span", { class: "num", role: "button", tabindex: 0, text: String(rank), title: rank === "—" ? t("isNew") : t("setPriority"), "aria-label": t("setPriority") });
  const cell = el("div", { class: "rank" + (reorder ? " handle" : "") });
  const arrow = (label, dir, off) => {
    const b = el("button", { text: label, disabled: off || false, "aria-label": label });
    b.onclick = () => move(s.id, dir);
    return b;
  };
  num.onclick = num.onkeydown = (e) => {
    if (e.type === "keydown" && e.key !== "Enter") return;
    const input = el("input", { type: "number", min: 1, step: 1, value: i < 0 ? null : i + 1, "aria-label": t("setPriority") });
    let done = false;
    const commit = (save) => {
      if (done) return;
      done = true;
      const n = Math.floor(Number(input.value));
      if (save && input.value.trim() !== "" && n >= 1 && n - 1 !== i) placeAt(s.id, n - 1); else render();
    };
    input.onkeydown = (k) => { if (k.key === "Enter") commit(true); if (k.key === "Escape") commit(false); };
    input.onblur = () => commit(true);
    num.replaceWith(input);
    input.focus(); input.select();
  };
  // Arrows and the number work under any sort, on the order you set; an untriaged session gets its first place by
  // number or by drag. Dragging needs the list shown in that order, so only then is there a handle.
  cell.append(...(i >= 0 ? [arrow("↑", -1, i === 0), num, arrow("↓", 1, i === ids.length - 1)] : [num]));
  if (reorder) {
    cell.append(el("span", { class: "grip", text: "⠿", title: t("dragToReorder"), "aria-hidden": "true" }));
    dragHandle(cell, s, li);
  }
  return cell;
}

// Copies the session into another account, the source kept unless "remove" is checked. An open session can't go:
// it keeps writing where it started.
function transferControl(s) {
  const targets = shown().filter((a) => a.dir !== s.account);
  const sel = el("select", { "aria-label": t("transferTo") }, targets.map((a) => el("option", { value: a.dir, text: a.name })));
  const rm = el("input", { type: "checkbox" });
  const go = btn(t("copy"), "", () => pending(go, t("transferring"), () => api("POST", `/api/transfer/${s.id}`, { to: sel.value, remove: rm.checked }),
    t(rm.checked ? "movedTo" : "copiedTo", { name: accountOf(sel.value)?.name })));
  rm.onchange = () => { go.textContent = t(rm.checked ? "move" : "copy"); };
  if (s.live) { go.disabled = true; go.title = t("err_open"); }
  return el("div", { class: "block" }, [
    el("div", { class: "k", text: t("transferTitle") }),
    el("div", { class: "transfer" }, [sel, el("label", {}, [rm, " " + t("removeFrom", { name: accountOf(s.account)?.name || "" })]), go]),

// The order you set: prioritized pending sessions only, filters ignored. Untriaged ones stay out of it until placed,
// so moving one session never prioritizes the others. Every move persists the whole order.
const triaged = () => pendingOrder().filter((s) => s.priority != null).map((s) => s.id);
function saveOrder(ids) {
  mutate(() => ids.forEach((id, i) => { byId(id).priority = (i + 1) * 10; }), () => api("POST", "/api/order", { ids }));
}
// Puts the session at 0-based place `at` (clamped), out of wherever it was.
function placeAt(id, at) {
  const ids = triaged().filter((x) => x !== id);
  ids.splice(Math.max(0, Math.min(at, ids.length)), 0, id);
  saveOrder(ids);
}
function move(id, dir) {
  const ids = triaged(), j = ids.indexOf(id) + dir;
  if (ids.includes(id) && j >= 0 && j < ids.length) placeAt(id, j);
}
function placeNear(id, target, after) {
  const ids = triaged().filter((x) => x !== id);
  placeAt(id, ids.indexOf(target) + (after ? 1 : 0));
}

// Asks for a done-detection run now and waits for it (or for the one already running) to finish, then reloads
// with whatever it found. Polls the light /api/classifier, not insights.
async function checkNow(b) {
  b.disabled = true; b.setAttribute("aria-busy", "true"); b.textContent = t("checking");
  try {
    const before = (await api("GET", "/api/classifier")).lastStart;
    await api("POST", "/api/classify");
    const end = Date.now() + 5 * 60e3;
    for (;;) {
      await new Promise((r) => setTimeout(r, 1500));
      const c = await api("GET", "/api/classifier");
      if (!c.running && c.lastStart && c.lastStart !== before) break;
      if (Date.now() > end) throw new Error(t("checkSlow"));
    }
    toast(t("checkDone"));

}

async function loadCloud() {

      panel(t("pPerDay"), t("last30"), [activity, el("div", { class: "axis" }, [el("span", { text: days[0].slice(5) }), el("span", { text: t("today") })])]),
      panel(t("pWeekly"), t("pWeeklySub"), [legend([["--s1", t("newL")], ["--s2", t("doneL")]]), weeks,
        el("div", { class: "axis" }, [el("span", { text: d.weeks[0].start.slice(5) }), el("span", { text: t("thisWeek") })])]),
    ]),
    panel(t("pLongest"), t("pLongestSub"), [costTable(d.topPrompts)]),
    panel(t("pCostliest"), t("pCostliestSub"), [costTable(d.topTokens)]),
    el("div", { class: "grid2" }, [
      panel(t("pStorage"), "", [el("div", { class: "tiles" }, [
        // One tile per account, edged in its color: its transcripts and how long Claude Code keeps them.
        ...s.accounts.map((a) => {
          const x = tile(fmtMb(a.transcriptsMb), t("sTranscripts", { name: accountOf(a.dir)?.name || a.dir, days: a.cleanupDays }));
          if (multi()) x.style.borderLeft = `3px solid ${accountOf(a.dir)?.color}`;
          return x;
        }),
        tile(fmtMb(s.backupMb), t("sBackup")),
        tile(s.pendingWithoutBackup.length, t("sNoBackup")),
        tile(s.expiringSoon.length, t("sExpiring")),
      ]), ...s.expiringSoon.map((x) => el("div", { class: x.backedUp ? "" : "warn" }, [acctDot(x.account),
        t("expires", { title: x.title, date: x.expiresAt.slice(0, 10) }) + (x.backedUp ? t("hasBackup") : t("noBackup"))]))]),
      classifierPanel(d.classifier),
      d.idleTabs ? panel(t("pIdleTabs"), t("pIdleTabsSub"), [
        el("div", { class: "meta", text: d.idleTabs.join(" · ") || t("none") }),
        d.idleTabs.length ? el("div", {}, [closeTabs]) : null]) : null,
    ]),
  );
}

async function load() {
  const was = machine;
  try { [items, accounts, classifier] = await Promise.all([api("GET", "/api/sessions"), api("GET", "/api/accounts"), api("GET", "/api/classifier"), loadCloud()]); } catch (e) {
    $("#counts").textContent = machine ? t("machineDown", { name: machineName(machine), msg: failed(e) }) : t("serverDown", { msg: e.message });
    return;
  }
  // The machine shown went away from the account meanwhile: show this one's sessions instead.
  if (machine !== was) return load();
  const sel = $("#proj"), cur = sel.value;
  sel.replaceChildren(el("option", { value: "", text: t("allProjects") }), ...[...new Set(items.map((s) => s.project).filter(Boolean))].sort().map((p) => el("option", { value: p, text: p })));
  sel.value = cur;
  const asel = $("#acct"), acur = asel.value;
  asel.replaceChildren(el("option", { value: "", text: t("allAccounts") }), ...shown().map((a) => el("option", { value: a.dir, text: a.name })));
  asel.value = shown().some((a) => a.dir === acur) ? acur : "";
  asel.hidden = !multi();
  const focused = document.activeElement?.id;
  render();
  if (view !== "insights" && !machine) loadTiles();
  if (focused) document.getElementById(focused)?.focus();
}

$("#machine").onchange = (e) => {
  machine = e.target.value;
  try { machine ? localStorage.setItem("machine", machine) : localStorage.removeItem("machine"); } catch {}
  selectedId = null;
  if (machine && view === "insights") showView("pending");
  load();
};
// Pairing and sign-in move on their own (a code typed elsewhere, a browser coming back): Settings follows them.
setInterval(async () => {
  if (view !== "settings" || document.hidden) return;
  const before = JSON.stringify([cloud, remote]);
  await loadCloud();
  if (JSON.stringify([cloud, remote]) !== before && !document.activeElement?.matches("input[type=text]")) render();
}, 2000);

$("#tabs").onclick = (e) => { const v = e.target.dataset?.v; if (v) showView(v); };
$("#settingsBtn").onclick = () => view === "settings" ? settingsBack() : showView("settings");
$("#q").oninput = render;
$("#proj").onchange = render;
$("#acct").onchange = render;
const saveSort = () => { try { localStorage.setItem("sort", $("#sort").value); localStorage.setItem("sortRev", sortRev ? "1" : ""); } catch {} render(); };
$("#sort").onchange = () => { sortRev = false; saveSort(); };
$("#sortDir").onclick = () => { sortRev = !sortRev; saveSort(); };
$("#liveOnly").onchange = render;
$("#suggestedOnly").onchange = render;
$("#checkNow").onclick = (e) => checkNow(e.currentTarget);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !document.activeElement?.matches("textarea")) load(); });
load();
</script>
</body>
</html>

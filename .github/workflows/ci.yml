# Every PR and push to main: the core's acceptance suite, the UI e2e specs and the packaged desktop app, on macOS and Windows.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch or PR supersedes a run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The release assets the landing page links to are out of reach whatever the repo default is; actions pinned by SHA.
permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci

      - name: Core (unit suite over HTTP)
        run: npm test
      - name: Core (macOS process spawning)
        if: runner.os == 'macOS'
        run: cargo test -p hangar-core
      - name: UI e2e, web target
        run: npm run test:e2e
      # WebView2 speaks the DevTools protocol, so on Windows the same specs drive the real desktop app.
      - name: WebView2 runtime
        if: runner.os == 'Windows'
        run: |
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv, name
          # Policies that could switch off remote debugging for the webview.
          foreach ($k in 'HKLM:\SOFTWARE\Policies\Microsoft\Edge', 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge\WebView2') {
            if (Test-Path $k) { "$k"; Get-ItemProperty $k | Format-List | Out-String }
          }
      - name: UI e2e, desktop app
        if: runner.os == 'Windows'
        timeout-minutes: 20
        run: npm run test:desktop
      - name: Packaged app
        run: npm run test:build

      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent target/release/bundle/macos/Hangar.app Hangar.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hangar-${{ runner.os }}
          path: |
            Hangar.zip
            target/release/bundle/nsis/*.exe
          if-no-files-found: ignore

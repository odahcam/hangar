[package]
name = "hangar-core"
description = "Hangar's core: catalog of Claude Code sessions, state, done detection, insights and terminal control."
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
base64 = "=0.23.1"
chacha20poly1305 = "=0.10.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = "=3.0.0"
getrandom = "=0.4.3"
keyring = "=4.2.0"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# ring, not the default aws-lc-rs: no cmake/nasm toolchain on the Windows build.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: an account's settings.json is rewritten with its keys where the user left them.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "=0.11.1"
snow = "=0.10.0"
spake2 = "=0.4.0"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
tiny_http = "0.12"
tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "=3.5.0", features = ["json"] }
wait-timeout = "0.2"
zeroize = { version = "=1.9.1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package]
name = "hangar-core"
description = "Hangar's core: catalog of Claude Code sessions, state, done detection, insights and terminal control."
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# preserve_order: an account's settings.json is rewritten with its keys where the user left them.
serde_json = { version = "1", features = ["preserve_order"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
tiny_http = "0.12"
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
